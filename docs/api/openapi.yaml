openapi: 3.1.0
info:
  title: TradePilot API
  version: 0.2.0
  description: |
    Contract for the routes currently exposed by `packages/tradepilot/api.py`.
    The default application uses process-local authentication and storage for
    development only. Production must inject managed identity and durable,
    tenant-isolated persistence.

    Workspace routes require both a Bearer session and `X-Workspace-ID`.
    The verified header must equal `{workspace_id}`; membership and any required
    role are resolved server-side. Data is user-supplied EOD demo data unless a
    separately licensed provider adapter is configured. Orders are paper-only.
servers:
  - url: http://127.0.0.1:8000
    description: Local Uvicorn
tags:
  - { name: System }
  - { name: Auth }
  - { name: Workspaces }
  - { name: Market data }
  - { name: Strategies }
  - { name: Analysis }
  - { name: Risk }
  - { name: Backtests }
  - { name: Paper trading }
  - { name: Notifications }
  - { name: Operations }
  - { name: Sandbox execution }
  - { name: Agents }
paths:
  /health:
    get:
      tags: [System]
      operationId: health
      security: []
      responses:
        "200":
          description: Process is serving requests.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties: { status: { const: ok } }

  /ready:
    get:
      tags: [System]
      operationId: readiness
      security: []
      responses:
        "200":
          description: Application and durable repository are ready.
          content:
            application/json:
              schema:
                type: object
                required: [status, checks]
                properties:
                  status: { const: ready }
                  checks: { type: object }
        "503":
          description: A required dependency is unavailable.

  /v1/market/relay/quotes:
    get:
      tags: [Market data]
      operationId: relayQuotes
      security: []
      summary: Cached US/crypto quotes from the server-side relay
      description: >
        Fans out the latest cached prices from one upstream Finnhub/Alpaca socket
        (or the simulator). Provider API keys never appear in the response.
      responses:
        "200":
          description: Relay snapshot.
          content:
            application/json:
              schema:
                type: object
                required: [provider, quotes]
                properties:
                  provider: { type: string }
                  disclaimer: { type: string }
                  quotes:
                    type: array
                    items:
                      type: object
                      required: [symbol, last, change_pct, as_of, source]
                      properties:
                        symbol: { type: string }
                        last: { type: number }
                        change_pct: { type: number }
                        as_of: { type: string, format: date-time }
                        source: { type: string }
                        delayed: { type: boolean }

  /v1/market/relay/stream:
    get:
      tags: [Market data]
      operationId: relayStream
      security: []
      summary: WebSocket fan-out of relay quotes
      description: Upgrade to WebSocket. Messages are hello + quote events from the shared cache.
      responses:
        "101":
          description: Switching Protocols

  /v1/auth/register:
    post:
      tags: [Auth]
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/Credentials" } }
      responses:
        "201":
          description: Development account registered.
          content:
            application/json: { schema: { $ref: "#/components/schemas/User" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/Credentials" } }
      responses:
        "200":
          description: Bearer session created.
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type]
                properties:
                  access_token: { type: string }
                  token_type: { const: bearer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Session revoked or already absent. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /v1/workspaces:
    get:
      tags: [Workspaces]
      operationId: listWorkspaces
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Workspaces for the authenticated user.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [workspace, role]
                  properties:
                    workspace: { $ref: "#/components/schemas/Workspace" }
                    role: { $ref: "#/components/schemas/Role" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
    post:
      tags: [Workspaces]
      operationId: createWorkspace
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties: { name: { type: string } }
      responses:
        "201":
          description: Workspace created with caller as owner.
          content:
            application/json: { schema: { $ref: "#/components/schemas/Workspace" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /v1/workspaces/{workspace_id}/members:
    post:
      tags: [Workspaces]
      operationId: addWorkspaceMember
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { $ref: "#/components/parameters/WorkspaceHeader" }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/MembershipInput" } }
      responses:
        "204": { description: Existing registered user added or membership replaced. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /v1/strategy-templates:
    get:
      tags: [Strategies]
      operationId: listStrategyTemplates
      security: []
      responses:
        "200":
          description: Built-in restricted strategy specifications.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { $ref: "../../schemas/strategy.schema.json" }

  /v1/workspaces/{workspace_id}/watchlist:
    get:
      tags: [Market data]
      operationId: listWatchlist
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { $ref: "#/components/parameters/WorkspaceHeader" }
      responses:
        "200":
          description: Workspace watchlist.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/WatchlistItem" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
    post:
      tags: [Market data]
      operationId: addWatchlistItem
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { $ref: "#/components/parameters/WorkspaceHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbol]
              properties: { symbol: { type: string } }
      responses:
        "201":
          description: Item created, or existing item returned.
          content:
            application/json: { schema: { $ref: "#/components/schemas/WatchlistItem" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/QuotaExceeded" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /v1/workspaces/{workspace_id}/watchlist/{symbol}:
    delete:
      tags: [Market data]
      operationId: removeWatchlistItem
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { $ref: "#/components/parameters/WorkspaceHeader" }
        - { name: symbol, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Item removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /v1/workspaces/{workspace_id}/datasets:
    get:
      tags: [Market data]
      operationId: listDatasets
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { $ref: "#/components/parameters/WorkspaceHeader" }
      responses:
        "200":
          description: Immutable datasets in this process.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Dataset" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
    post:
      tags: [Market data]
      operationId: createDataset
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { $ref: "#/components/parameters/WorkspaceHeader" }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/DatasetInput" } }
      responses:
        "201":
          description: Draft dataset created; repeated derived dataset ID returns existing data.
          content:
            application/json: { schema: { $ref: "#/components/schemas/Dataset" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /v1/workspaces/{workspace_id}/datasets/{dataset_id}/publish:
    post:
      tags: [Market data]
      operationId: publishDataset
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { $ref: "#/components/parameters/WorkspaceHeader" }
        - { name: dataset_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Validated dataset published. Requires publisher role; owners inherit it.
          content:
            application/json: { schema: { $ref: "#/components/schemas/Dataset" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/FeatureDisabled" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /v1/workspaces/{workspace_id}/strategies:
    get:
      tags: [Strategies]
      operationId: listStrategies
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { $ref: "#/components/parameters/WorkspaceHeader" }
      responses:
        "200":
          description: Workspace strategies.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/StrategyRecord" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
    post:
      tags: [Strategies]
      operationId: createStrategy
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { $ref: "#/components/parameters/WorkspaceHeader" }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/StrategyInput" } }
      responses:
        "201":
          description: Strategy created, or existing same-name strategy returned.
          content:
            application/json: { schema: { $ref: "#/components/schemas/StrategyRecord" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/QuotaExceeded" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /v1/workspaces/{workspace_id}/analyses:
    get:
      tags: [Analysis]
      operationId: listAnalyses
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { $ref: "#/components/parameters/WorkspaceHeader" }
      responses:
        "200":
          description: Workspace analysis history.
          content:
            application/json:
              schema: { type: array, items: { $ref: "../../schemas/analysis.schema.json" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
    post:
      tags: [Analysis]
      operationId: createAnalysis
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { $ref: "#/components/parameters/WorkspaceHeader" }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/AnalysisInput" } }
      responses:
        "201":
          description: Deterministic analysis created, or same idempotency result returned.
          content:
            application/json: { schema: { $ref: "../../schemas/analysis.schema.json" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/QuotaExceeded" }
        "503": { $ref: "#/components/responses/FeatureDisabled" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /v1/workspaces/{workspace_id}/analyses/{analysis_id}/explanation:
    post:
      tags: [Analysis]
      operationId: createExplanation
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { $ref: "#/components/parameters/WorkspaceHeader" }
        - { name: analysis_id, in: path, required: true, schema: { type: string } }
      responses:
        "201":
          description: Schema-validated explanation or deterministic fallback.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ExplanationRecord" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/FeatureDisabled" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /v1/workspaces/{workspace_id}/risk/position-size:
    post:
      tags: [Risk]
      operationId: calculatePositionSize
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { $ref: "#/components/parameters/WorkspaceHeader" }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/RiskInput" } }
      responses:
        "200":
          description: Deterministic quantity using default risk limits.
          content:
            application/json:
              schema:
                type: object
                required: [quantity]
                properties: { quantity: { type: integer, minimum: 0 } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /v1/workspaces/{workspace_id}/backtests/{dataset_id}:
    post:
      tags: [Backtests]
      operationId: runBacktest
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { $ref: "#/components/parameters/WorkspaceHeader" }
        - { name: dataset_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Synchronous built-in buy-once backtest using next-session fills.
          content:
            application/json: { schema: { $ref: "#/components/schemas/BacktestResult" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/QuotaExceeded" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /v1/workspaces/{workspace_id}/paper/orders:
    get:
      tags: [Paper trading]
      operationId: listPaperOrders
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { $ref: "#/components/parameters/WorkspaceHeader" }
      responses:
        "200":
          description: Paper-order history.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/PaperOrder" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
    post:
      tags: [Paper trading]
      operationId: createPaperOrder
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { $ref: "#/components/parameters/WorkspaceHeader" }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/PaperOrderInput" } }
      responses:
        "201":
          description: Idempotent paper fill at available next-session open.
          content:
            application/json: { schema: { $ref: "#/components/schemas/PaperOrder" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /v1/workspaces/{workspace_id}/notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { $ref: "#/components/parameters/WorkspaceHeader" }
      responses:
        "200":
          description: Enqueued notification messages.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/OutboxMessage" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
    post:
      tags: [Notifications]
      operationId: enqueueNotification
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { $ref: "#/components/parameters/WorkspaceHeader" }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/NotificationInput" } }
      responses:
        "202":
          description: Notification enqueued, or duplicate acknowledged without replay.
          content:
            application/json:
              schema:
                type: object
                required: [id, created]
                properties:
                  id: { type: string }
                  created: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/QuotaExceeded" }
        "503": { $ref: "#/components/responses/FeatureDisabled" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /v1/workspaces/{workspace_id}/audit:
    get:
      tags: [Operations]
      operationId: listAudit
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { $ref: "#/components/parameters/WorkspaceHeader" }
      responses:
        "200":
          description: Workspace audit history. Requires auditor role; owners inherit it.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /v1/workspaces/{workspace_id}/dashboard:
    get:
      tags: [Operations]
      operationId: getWorkspaceDashboard
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { $ref: "#/components/parameters/WorkspaceHeader" }
      responses:
        "200":
          description: Persisted workspace data projected for the web dashboard.
          content:
            application/json: { schema: { $ref: "#/components/schemas/Dashboard" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/dashboard:
    get:
      tags: [Operations]
      operationId: getSelectedWorkspaceDashboard
      description: Alias using the verified `X-Workspace-ID` as the selected workspace.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceHeader" }
      responses:
        "200":
          description: Selected workspace dashboard.
          content:
            application/json: { schema: { $ref: "#/components/schemas/Dashboard" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /v1/workspaces/{workspace_id}/market/quotes/{symbol}:
    get:
      tags: [Market data]
      operationId: getRealtimeQuote
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { $ref: "#/components/parameters/WorkspaceHeader" }
        - { name: symbol, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Simulated or licensed-provider normalized quote.
          content:
            application/json: { schema: { $ref: "#/components/schemas/Quote" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /v1/workspaces/{workspace_id}/sandbox/orders:
    get:
      tags: [Sandbox execution]
      operationId: listSandboxOrders
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { $ref: "#/components/parameters/WorkspaceHeader" }
      responses:
        "200":
          description: Workspace sandbox orders.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SandboxOrder" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Sandbox execution]
      operationId: submitSandboxOrder
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { $ref: "#/components/parameters/WorkspaceHeader" }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/SandboxOrderInput" } }
      responses:
        "201":
          description: Idempotent sandbox order result.
          content:
            application/json: { schema: { $ref: "#/components/schemas/SandboxOrder" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { description: Sandbox or autonomous execution is disabled. }

  /v1/workspaces/{workspace_id}/sandbox/orders/{order_id}/cancel:
    post:
      tags: [Sandbox execution]
      operationId: cancelSandboxOrder
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { $ref: "#/components/parameters/WorkspaceHeader" }
        - { name: order_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Updated sandbox order.
          content:
            application/json: { schema: { $ref: "#/components/schemas/SandboxOrder" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Order not found. }
        "409": { description: Order is no longer cancellable. }

  /v1/workspaces/{workspace_id}/execution/control:
    get:
      tags: [Sandbox execution]
      operationId: getExecutionControl
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { $ref: "#/components/parameters/WorkspaceHeader" }
      responses:
        "200":
          description: Effective workspace execution kill state.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ExecutionControl" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [Sandbox execution]
      operationId: setExecutionControl
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { $ref: "#/components/parameters/WorkspaceHeader" }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/ExecutionControlInput" } }
      responses:
        "200":
          description: Updated workspace execution kill state.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ExecutionControl" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /v1/workspaces/{workspace_id}/agents:
    get:
      tags: [Agents]
      operationId: listTradingAgents
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { $ref: "#/components/parameters/WorkspaceHeader" }
      responses:
        "200":
          description: Workspace autonomous agents.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/TradingAgent" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Agents]
      operationId: createTradingAgent
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { $ref: "#/components/parameters/WorkspaceHeader" }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/AgentInput" } }
      responses:
        "201":
          description: Agent created paused for review.
          content:
            application/json: { schema: { $ref: "#/components/schemas/TradingAgent" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /v1/workspaces/{workspace_id}/agents/{agent_id}/control:
    post:
      tags: [Agents]
      operationId: controlTradingAgent
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { $ref: "#/components/parameters/WorkspaceHeader" }
        - { name: agent_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/AgentControlInput" } }
      responses:
        "200":
          description: Updated agent lifecycle state.
          content:
            application/json: { schema: { $ref: "#/components/schemas/TradingAgent" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Agent not found. }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { description: Autonomous execution is disabled. }

  /v1/workspaces/{workspace_id}/agents/{agent_id}/decisions:
    get:
      tags: [Agents]
      operationId: listAgentDecisions
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { $ref: "#/components/parameters/WorkspaceHeader" }
        - { name: agent_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Append-only explainable decisions for the agent.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AgentDecision" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Agent not found. }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-session
      description: Process-local opaque session in development; managed revocable identity in production.
  parameters:
    WorkspaceId:
      name: workspace_id
      in: path
      required: true
      schema: { type: string }
    WorkspaceHeader:
      name: X-Workspace-ID
      in: header
      required: true
      description: Selected workspace; server verifies membership and equality with the path.
      schema: { type: string }
  responses:
    BadRequest:
      description: Domain validation or authentication operation failed.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthorized:
      description: Bearer session missing, malformed, invalid, or expired.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: Workspace mismatch, missing membership, or missing role.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Workspace-scoped resource not found.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    QuotaExceeded:
      description: Workspace beta quota reached.
      content:
        application/json:
          schema:
            type: object
            required: [detail]
            properties:
              detail:
                type: object
                required: [code, quota, limit]
                properties:
                  code: { const: quota_exceeded }
                  quota: { type: string }
                  limit: { type: integer }
    FeatureDisabled:
      description: Workspace kill switch disabled this feature.
      content:
        application/json:
          schema:
            type: object
            required: [detail]
            properties:
              detail:
                type: object
                required: [code, feature]
                properties:
                  code: { const: feature_disabled }
                  feature: { type: string }
    ValidationError:
      description: FastAPI request validation failed.
      content:
        application/json:
          schema:
            type: object
            required: [detail]
            properties:
              detail: { type: array, items: { type: object } }
  schemas:
    Error:
      type: object
      required: [detail]
      properties: { detail: { type: string } }
    Credentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
    User:
      type: object
      required: [id, email]
      properties:
        id: { type: string }
        email: { type: string }
    Workspace:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    Role: { type: string, enum: [owner, publisher, auditor, member] }
    MembershipInput:
      type: object
      required: [email]
      properties:
        email: { type: string }
        role: { $ref: "#/components/schemas/Role", default: member }
    WatchlistItem:
      type: object
      required: [symbol, created_at]
      properties:
        symbol: { type: string, pattern: "^[A-Z0-9&-]{1,20}$" }
        created_at: { type: string, format: date-time }
    Bar:
      type: object
      required: [session, open, high, low, close, volume]
      properties:
        session: { type: string, format: date }
        open: { $ref: "#/components/schemas/DecimalInput" }
        high: { $ref: "#/components/schemas/DecimalInput" }
        low: { $ref: "#/components/schemas/DecimalInput" }
        close: { $ref: "#/components/schemas/DecimalInput" }
        volume: { type: integer }
    DatasetInput:
      type: object
      required: [symbol, idempotency_key, bars]
      properties:
        symbol: { type: string }
        idempotency_key: { type: string }
        bars: { type: array, minItems: 1, items: { $ref: "#/components/schemas/Bar" } }
    Dataset:
      type: object
      required: [id, symbol, bars, checksum, created_at, status]
      properties:
        id: { type: string }
        symbol: { type: string }
        bars: { type: array, items: { $ref: "#/components/schemas/Bar" } }
        checksum: { type: string, pattern: "^[0-9a-f]{64}$" }
        created_at: { type: string, format: date-time }
        status: { type: string, enum: [draft, published] }
    StrategyInput:
      type: object
      required: [name, spec]
      properties:
        name: { type: string }
        spec: { $ref: "../../schemas/strategy.schema.json" }
    StrategyRecord:
      type: object
      required: [name, spec]
      properties:
        name: { type: string }
        spec: { $ref: "../../schemas/strategy.schema.json" }
    AnalysisInput:
      type: object
      required: [idempotency_key, dataset_id, strategy_name]
      properties:
        idempotency_key: { type: string }
        dataset_id: { type: string }
        strategy_name: { type: string }
    Explanation:
      type: object
      additionalProperties: false
      required: [summary, factors, risks, disclaimer]
      properties:
        summary: { type: string, minLength: 1, maxLength: 500 }
        factors: { type: array, minItems: 1, maxItems: 8, items: { type: string } }
        risks: { type: array, minItems: 1, maxItems: 8, items: { type: string } }
        disclaimer: { const: "Educational analysis, not investment advice." }
    ExplanationRecord:
      type: object
      required: [analysis_id, explanation, model_version, prompt_version, fallback, created_at]
      properties:
        analysis_id: { type: string }
        explanation: { $ref: "#/components/schemas/Explanation" }
        model_version: { type: string }
        prompt_version: { type: string }
        fallback: { type: boolean }
        created_at: { type: string, format: date-time }
    RiskInput:
      type: object
      required: [equity, entry, stop]
      properties:
        equity: { $ref: "#/components/schemas/DecimalInput" }
        entry: { $ref: "#/components/schemas/DecimalInput" }
        stop: { $ref: "#/components/schemas/DecimalInput" }
    DecimalInput:
      description: Pydantic Decimal accepts a JSON number or decimal string.
      oneOf:
        - { type: number }
        - { type: string, pattern: "^(?!^[-+.]*$)[+-]?0*\\d*\\.?\\d*$" }
    Quote:
      type: object
      required: [symbol, bid, ask, last, as_of, sequence, provider]
      properties:
        symbol: { type: string }
        bid: { $ref: "#/components/schemas/DecimalInput" }
        ask: { $ref: "#/components/schemas/DecimalInput" }
        last: { $ref: "#/components/schemas/DecimalInput" }
        as_of: { type: string, format: date-time }
        sequence: { type: integer, minimum: 1 }
        provider: { type: string }
    SandboxOrderInput:
      type: object
      required: [idempotency_key, symbol, side, quantity, equity, cash]
      properties:
        idempotency_key: { type: string, minLength: 1, maxLength: 120 }
        symbol: { type: string, minLength: 1, maxLength: 20 }
        side: { enum: [buy, sell] }
        quantity: { type: integer, minimum: 1 }
        order_type: { enum: [market, limit], default: market }
        limit_price:
          oneOf:
            - { $ref: "#/components/schemas/DecimalInput" }
            - { type: "null" }
        equity: { $ref: "#/components/schemas/DecimalInput" }
        cash: { $ref: "#/components/schemas/DecimalInput" }
        daily_pnl: { $ref: "#/components/schemas/DecimalInput" }
        current_position: { type: integer, default: 0 }
        open_orders: { type: integer, minimum: 0, default: 0 }
        agent_id: { type: [string, "null"] }
    SandboxOrder:
      type: object
      description: Decimal values are serialized as strings by the API.
      additionalProperties: true
    ExecutionControlInput:
      type: object
      required: [killed, reason]
      properties:
        killed: { type: boolean }
        reason: { type: string, minLength: 1, maxLength: 500 }
    ExecutionControl:
      type: object
      required: [scope, killed, reason, version]
      properties:
        scope: { const: workspace }
        killed: { type: boolean }
        reason: { type: string }
        version: { type: integer, minimum: 0 }
        updated_at: { type: string, format: date-time }
    AgentInput:
      type: object
      required: [name, symbols, strategy, max_capital, max_daily_loss]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        symbols:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string }
        strategy: { type: string, minLength: 1, maxLength: 120 }
        max_capital: { $ref: "#/components/schemas/DecimalInput" }
        max_daily_loss: { $ref: "#/components/schemas/DecimalInput" }
    AgentControlInput:
      type: object
      required: [action, reason]
      properties:
        action: { enum: [start, pause, resume, stop, kill] }
        reason: { type: string, minLength: 1, maxLength: 500 }
    TradingAgent:
      type: object
      additionalProperties: true
    AgentDecision:
      type: object
      required: [id, agent_id, signal, indicators, rationale, risk_checks, authority_version, created_at]
      properties:
        id: { type: string }
        agent_id: { type: string }
        signal: { type: object }
        indicators: { type: array, items: { type: object } }
        rationale: { type: object }
        risk_checks: { type: array, items: { type: object } }
        authority_version: { type: string }
        resulting_order_id: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
    Fill:
      type: object
      required: [symbol, session, side, quantity, price, fees]
      properties:
        symbol: { type: string }
        session: { type: string, format: date }
        side: { type: string, enum: [buy, sell] }
        quantity: { type: integer }
        price: { type: number }
        fees: { type: number }
    Manifest:
      type: object
      required: [dataset_checksum, strategy_hash, engine_version, created_at]
      properties:
        dataset_checksum: { type: string, pattern: "^[0-9a-f]{64}$" }
        strategy_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        engine_version: { type: string }
        created_at: { type: string, format: date-time }
    BacktestResult:
      type: object
      required: [fills, cash, position, manifest]
      properties:
        fills: { type: array, items: { $ref: "#/components/schemas/Fill" } }
        cash: { type: number }
        position: { type: integer }
        manifest: { $ref: "#/components/schemas/Manifest" }
    PaperOrderInput:
      type: object
      required: [idempotency_key, dataset_id, signal_session, side, quantity]
      properties:
        idempotency_key: { type: string }
        dataset_id: { type: string }
        signal_session: { type: string, format: date }
        side: { type: string }
        quantity: { type: integer, exclusiveMinimum: 0 }
    PaperOrder:
      type: object
      required: [id, dataset_id, signal_session, fill]
      properties:
        id: { type: string }
        dataset_id: { type: string }
        signal_session: { type: string, format: date }
        fill: { $ref: "#/components/schemas/Fill" }
    NotificationInput:
      type: object
      required: [idempotency_key, chat_id, text]
      properties:
        idempotency_key: { type: string }
        chat_id: { type: string }
        text: { type: string, minLength: 1, maxLength: 4096 }
    OutboxMessage:
      type: object
      required: [id, tenant_id, topic, payload, created_at]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        topic: { const: telegram }
        payload:
          type: object
          required: [chat_id, text]
          properties:
            chat_id: { type: string }
            text: { type: string }
        created_at: { type: string, format: date-time }
    AuditEvent:
      type: object
      required: [id, tenant_id, actor_id, action, resource, occurred_at, detail]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        actor_id: { type: string }
        action: { type: string }
        resource: { type: string }
        occurred_at: { type: string, format: date-time }
        detail: { type: object }
    Dashboard:
      type: object
      required: [workspace, freshness, watchlist, strategies, analysis, risk, portfolio, history, backtest, notifications, metadata]
      properties:
        workspace: { type: object }
        freshness: { type: object }
        watchlist: { type: array, items: { type: object } }
        strategies: { type: array, items: { type: object } }
        analysis: { type: object }
        risk: { type: object }
        portfolio: { type: object }
        history: { type: array, items: { type: object } }
        backtest: { type: object }
        notifications: { type: array, items: { type: object } }
        metadata: { type: object }
