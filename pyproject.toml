[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradepilot"
version = "0.1.0"
description = "TradePilot modular-monolith backend MVP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]
prod = ["uvicorn[standard]>=0.30,<1"]

[tool.hatch.build.targets.wheel]
packages = ["packages/tradepilot"]

[tool.pytest.ini_options]
pythonpath = ["packages", "."]
testpaths = ["tests"]
addopts = "-q"
