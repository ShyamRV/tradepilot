# TradePilot — forever-free Render blueprint ($0)
# - Free web service (spins down after ~15 min idle; cold start ~1 min)
# - API + Telegram worker share one free web service
# - Postgres: Neon Free via DATABASE_URL (not Render Free Postgres)
# Setup: docs/render-free.md

services:
  - type: web
    name: tradepilot-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: sh scripts/render_start.sh
    plan: free
    healthCheckPath: /ready
    envVars:
      - key: TRADEPILOT_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: MARKET_DATA_PROVIDER
        value: unconfigured
      - key: MARKET_DATA_MODE
        value: delayed
      - key: TRADEPILOT_RATE_LIMIT_PER_MINUTE
        value: "120"
      - key: WORKER_POLL_SECONDS
        value: "5"
      - key: TRADEPILOT_WORKER_INTERVAL_SECONDS
        value: "15"
      # Required — paste from local .env.local (pooled URL). Never commit secrets.
      - key: DATABASE_URL
        sync: false
      - key: TRADEPILOT_CORS_ORIGINS
        sync: false
      # Optional — empty by default so Blueprint sync is not blocked
      - key: TELEGRAM_BOT_TOKEN
        value: ""
      - key: SENTRY_DSN
        value: ""
